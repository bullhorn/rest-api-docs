GeneralLedgerSegmentEntity:
  type: object
  description: |
    Represents a segment dimension in the Chart of Accounts structure that enables multi-dimensional
    financial reporting and tracking.

    GL Segments allow organizations to categorize transactions beyond just the account number.
    They provide additional dimensions for reporting such as Department, Division, Location,
    Class, or Project.

    Segments are assigned to Placements, BillableCharges, and PayableCharges to enable detailed
    financial analysis and reporting across multiple dimensions.

    **See Also**:
    - Workflow: [General Ledger Integration](#tag/General-Ledger-Integration)
    - Related: GeneralLedgerSegmentType - Defines the type/purpose of the segment
    - Related: EarnCode - Can have default GL segments assigned
    - Related: Placement - Segments inherited by transactions

    **CRUD Access**: CREATE, READ, UPDATE

    **Entitlements**:
    - View General Ledger Configuration
    - Manage General Ledger Segments

    **Common Segment Types**:
    - **Class**: Business classification (Services, Products, etc.)
    - **Division**: Organizational division (East, West, etc.)
    - **Department**: Functional department (HR, IT, Finance)
    - **Location**: Physical location (New York, Chicago)
    - **Country**: Geographic country

  properties:
    id:
      type: integer
      format: int32
      description: |
        Unique identifier for this entity.
      readOnly: true
      example: 500

    externalSegmentNumber:
      type: string
      maxLength: 100
      description: |
        External segment number from the accounting system. This is the code or identifier
        used to reference this segment value in the Chart of Accounts.

        Examples: "100", "EAST", "NYC", "HR"
      example: "100"

    externalSegmentName:
      type: string
      maxLength: 100
      description: |
        External segment name from the accounting system. Human-readable name for the
        segment value that appears on financial reports.

        Examples: "Eastern Division", "New York Office", "Human Resources"
      example: "Eastern Division"

    generalLedgerSegmentType:
      type: object
      description: |
        Type of segment this represents (e.g., Class, Division, Department, Location, Country).
        Determines which dimension of the Chart of Accounts this segment belongs to.

        Segment types are configured at the organization level and map to the 5 segment
        fields available on transactions (generalLedgerSegment1 through generalLedgerSegment5).
      readOnly: true
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
      example:
        id: 2
        name: "Division"

    isActive:
      type: boolean
      description: |
        Indicates whether this segment is active and available for use. Inactive segments
        are hidden from selection lists but preserved for historical transactions.
      default: true
      example: true

    isDeleted:
      type: boolean
      description: |
        Soft delete flag. When true, the segment is hidden from normal queries but preserved
        for historical transactions and reporting.
      readOnly: true
      default: false
      example: false

  required:
    - id
    - externalSegmentNumber
    - externalSegmentName
    - generalLedgerSegmentType
    - isActive
    - isDeleted

  example:
    id: 500
    externalSegmentNumber: "100"
    externalSegmentName: "Eastern Division"
    generalLedgerSegmentType:
      id: 2
      name: "Division"
    isActive: true
    isDeleted: false
