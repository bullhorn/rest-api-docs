UnbilledRevenueDistributionBatchEntity:
  type: object
  description: |
    Groups unbilled revenue distribution records into a single batch for systematic processing,
    enabling a streamlined transition from accrued revenue to invoicing. This batch entity tracks
    the creation of general ledger distribution records that recognize revenue before invoices
    are generated.

    UnbilledRevenueDistributionBatch is created by automated GL distribution processes that run
    periodically to generate accounting entries for work performed but not yet invoiced. The batch
    groups all UnbilledRevenueDistribution records created in a single run, providing traceability
    and batch-level status tracking.

    **See Also**:
    - Workflow: [Billing Workflow](#tag/Billing-Workflow)
    - Related: UnbilledRevenueDistribution - Individual GL distribution records in this batch
    - Related: BillMasterTransactionDistributionBatch - Transaction batch that triggers distribution
    - Related: BillableCharge - Charges with unbilled revenue
    - Related: BillMasterTransaction - Transactions being distributed
    - Related: BatchStatusLookup - Status tracking for batch processing

    **CRUD Access**: READ (created and managed by pay-export-services)

    **Entitlements**: View Bill Master Transaction, View Billable Charge

    **Batch Processing Flow**:
    1. BillMasterTransactionDistributionBatch created and transactions stamped
    2. UnbilledRevenueDistributionBatch created
    3. UnbilledRevenueDistribution records generated (one per transaction)
    4. GL export to external accounting systems
    5. Batch status updated to reflect completion

    **Relationship**: This entity is tightly coupled with BillMasterTransactionDistributionBatch.
    When a transaction distribution batch is processed, it triggers creation of this batch which
    then generates the actual GL distribution records for export.

  properties:
    id:
      type: integer
      format: int32
      description: |
        Unique identifier for this entity. Auto-generated sequence number.
      readOnly: true
      example: 9000

    batchStatus:
      type: object
      description: |
        Current processing status of this distribution batch. Required field tracking batch
        through its lifecycle.

        **Batch Status Values** (BatchStatusLookup):
        - **1 = Pending**: Batch created, not yet processed
        - **2 = Processing**: Currently generating distributions
        - **3 = Completed**: All distributions successfully created
        - **4 = Failed**: Processing encountered errors
        - **5 = Cancelled**: Batch cancelled before completion

        Used to monitor batch processing and identify failed batches requiring attention.
        Only Completed batches have all distributions finalized and ready for GL export.
      properties:
        id:
          type: integer
          format: int32
        label:
          type: string
      example:
        id: 3
        label: "Completed"

    billableCharges:
      type: object
      description: |
        Collection of BillableCharge records that have unbilled revenue distributed in this
        batch. Read-only association providing charge-level view of what was distributed.
        Multiple transactions from same charge may be included in the distribution.

        **Usage**: GET /entity/UnbilledRevenueDistributionBatch/{id}/billableCharges

        Used for charge-level reconciliation and identifying which charges have had revenue
        recognized in the general ledger. Important for financial reporting and ensuring
        all work performed is properly accrued.
      properties:
        total:
          type: integer
          description: Total count of unique charges with distributions in this batch
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
      example:
        total: 45

    canvasReport:
      type: object
      nullable: true
      description: |
        Reference to CanvasReport entity that may be associated with this batch. Optional field.
        Used when batch processing is initiated from a Canvas report or when results need to be
        displayed in Canvas reporting framework. Enables users to track which report generated
        this batch and provides link back to report for analysis.
      properties:
        id:
          type: integer
          format: int64
      example:
        id: 2000

    unbilledRevenueDistributions:
      type: object
      description: |
        Collection of UnbilledRevenueDistribution records generated by this batch. Read-only
        association. Each distribution record represents GL entries (debit/credit) for one
        BillMasterTransaction. This is the primary output of the batch - the actual accounting
        records that get exported to external GL systems.

        **Usage**: GET /entity/UnbilledRevenueDistributionBatch/{id}/unbilledRevenueDistributions

        Critical for GL reconciliation and ensuring all transactions have proper accounting
        entries. Typically one distribution record per transaction, but complex transactions
        may have multiple distributions for different GL account segments.
      readOnly: true
      properties:
        total:
          type: integer
          description: Total count of distribution records in batch
        data:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
      example:
        total: 150

    owner:
      type: object
      description: |
        CorporateUser who owns this batch record. Required field. Default value is the user
        who created the batch (typically a system user account for automated processes).
        Used for authorization and batch management access control. Important for tracking
        who initiated distribution processing and for support troubleshooting.
      properties:
        id:
          type: integer
          format: int64
        firstName:
          type: string
        lastName:
          type: string
      example:
        id: 1
        firstName: "System"
        lastName: "Admin"

    dateAdded:
      type: string
      format: date-time
      description: |
        Timestamp when this batch record was created. Required field. Read-only. Represents
        when distribution processing started for this batch. Used for tracking batch timing
        and identifying batches by creation date. Important for performance analysis, audit
        trails, and ensuring timely revenue recognition for period-end close.
      readOnly: true
      example: "2024-01-31T23:00:00Z"

    dateLastModified:
      type: string
      format: date-time
      description: |
        Timestamp when this batch record was last updated. Required field. Read-only. Updated
        when batch status changes or processing completes. Used for monitoring batch lifecycle
        and identifying when batches finished processing. Important for SLA tracking, error
        recovery, and understanding processing duration.
      readOnly: true
      example: "2024-01-31T23:30:00Z"

  required:
    - id
    - batchStatus
    - owner
    - dateAdded
    - dateLastModified

  example:
    id: 9000
    batchStatus:
      id: 3
      label: "Completed"
    billableCharges:
      total: 45
    canvasReport:
      id: 2000
    unbilledRevenueDistributions:
      total: 150
    owner:
      id: 1
      firstName: "System"
      lastName: "Admin"
    dateAdded: "2024-01-31T23:00:00Z"
    dateLastModified: "2024-01-31T23:30:00Z"
