tags:
  - name: Overview
    description: |
      # Bullhorn Middle Office API

      The Bullhorn Middle Office API provides programmatic access to the Middle Office suite,
      managing the complete lifecycle from placement configuration through time/expense entry
      to payroll and billing operations.

      ## Middle Office Systems

      Middle Office consists of three integrated systems:

      - **Pay Bill System** (91 entities): Manages billing, invoicing, rate cards, general ledger
        integration, and revenue recognition. Core entities include BillableCharge, BillMaster,
        BillMasterTransaction, InvoiceStatement, and BillingProfile.

      - **Time and Labor System** (7 entities): Handles time entry, expense reporting, and
        approval workflows for contractor placements. Core entities include Timesheet and
        ExpenseSheet.

      - **Bullhorn Time & Expense (BTE) System** (7 entities): Manages placement configuration,
        certifications, onboarding, and shift scheduling. Core entities include PlacementCertification
        and OnboardingConfiguration.

      ## Quick Start

      1. **Authenticate**: Obtain BhRestToken via OAuth 2.0 flow
      2. **Create Charge**: POST to `/services/BillableCharge`
      3. **Mark Ready**: POST to `/services/BillableCharge/markAsReady`
      4. **Generate Invoice**: Invoice generation happens via billing batch processes
      5. **Deliver Invoice**: POST to `/services/InvoiceStatement/email`

      ## Common API Patterns

      ### Create Billable Charge
      ```http
      PUT /services/BillableCharge
      {
        "description": "Weekly billing for placement",
        "periodEndDate": "2025-01-31",
        "placement": {"id": 12345},
        "billMasters": [{
          "earnCode": {"id": 1},
          "transactionDate": "2025-01-27",
          "quantity": 40.0,
          "rate": 75.00,
          "amount": 3000.00
        }]
      }
      ```

      ### Mark Charge Ready for Billing
      ```http
      POST /services/BillableCharge/markAsReady
      {"billableChargeIds": [67890]}
      ```

      ## Next Steps

      - Review [Billing Workflow](#tag/Billing-Workflow) to understand charge lifecycle
      - Review [Invoicing Workflow](#tag/Invoicing-Workflow) for invoice generation
      - Explore [BillableCharge Services](#tag/BillableCharge-Services) for available operations
      - Reference [Entity Documentation](#tag/BillableCharge-Entities) for data structures

  - name: Authentication
    description: |
      # Authentication & Authorization

      The Bullhorn Middle Office API uses OAuth 2.0 for authentication followed by a session-based token system.

      ## Authentication Flow

      1. **Obtain OAuth 2.0 Access Token**: Through the OAuth authorization flow
      2. **Call /login endpoint**: Exchange access token for `BhRestToken`
      3. **Include BhRestToken**: In all subsequent API requests

      ## Providing the Token

      The `BhRestToken` can be provided in three ways:

      - **HTTP Header** (recommended): `BhRestToken: a1b2c3d4-e5f6-g7h8-i9j0-k1l2m3n4o5p6`
      - **Query Parameter**: `?BhRestToken=<token>`
      - **Cookie**: Automatically set by login endpoint for browser clients

      ## Base URL Structure

      ```
      https://rest{swimlane}.bullhornstaffing.com/rest-services/{corpToken}/{endpoint}
      ```

      Where:
      - `{swimlane}`: Your data center swimlane number (e.g., '9', '22', or empty for default)
      - `{corpToken}`: Corporation token from login response (e.g., 'e999')

      ## Example Request

      ```bash
      curl -X GET \
        'https://rest9.bullhornstaffing.com/rest-services/e999/entity/InvoiceStatement/12345' \
        -H 'BhRestToken: a1b2c3d4-e5f6-g7h8-i9j0-k1l2m3n4o5p6'
      ```

      ## Entitlements

      Operations require specific entitlements:
      - **View Invoice Statement**: Required to retrieve invoice data
      - **Edit Invoice Statement**: Required to modify invoices
      - **Mark Billable Charge Ready**: Required to transition charges to billing
      - **Mark Billable Charge Unbillable**: Required to mark charges as non-billable

      See individual endpoint documentation for entitlement requirements.

  - name: Billing Workflow
    description: |
      # Billing Workflow: Time Entry to Invoice

      This workflow shows how approved time and expense entries are transformed into billable charges
      ready for invoicing.

      ```
      1. TIME/EXPENSE ENTRY (Time and Labor System)
         └─> Timesheet/ExpenseSheet approved

      2. CHARGE CREATION (Pay Bill - BillableCharge)
         └─> BillableCharge created, status = NotReadyToBill
         └─> Related endpoints: PUT /services/BillableCharge

      3. TRANSACTION GROUPING (Pay Bill - BillMaster)
         └─> BillMaster groups by earn code + transaction date
         └─> BillMasterTransaction records rates, amounts, audit trail
         └─> See: BillMasterEntity, BillMasterTransactionEntity

      4. APPROVAL & REVIEW (Pay Bill - Workflows)
         └─> Transactions approved (status = Approved)
         └─> Review flags cleared (needsReview = false)
         └─> Charge status → ReadyToBill
         └─> Related endpoints: POST /services/BillableCharge/markAsReady

      5. READY FOR INVOICING
         └─> Charge eligible for invoice generation
         └─> Appears in billing batch selection
      ```

      ## Entity Hierarchy

      ```
      BillableCharge (Charge-level container)
        ├─> BillMaster (Master-level grouping by earn code/date)
        │     └─> BillMasterTransaction (Individual transaction audit trail)
        │           ├─> BillMasterTransactionDiscountDetail
        │           ├─> BillMasterTransactionSurchargeDetail
        │           └─> BillMasterTransactionSalesTaxDetail
        │
        └─> InvoiceStatementLineItem (When invoiced)
              └─> InvoiceStatement (Final invoice to client)
      ```

      ## BillableCharge Status Flow

      | Status | ID | Description | Next States |
      |--------|----|-----------|----|
      | **NotReadyToBill** | 1 | Default state | ReadyToBill, OnHold, Unbillable |
      | **ReadyToBill** | 2 | Eligible for invoicing | Invoicing, OnHold |
      | **Processing** | 3 | Bill masters syncing | ReadyToBill, ProcessingFailed |
      | **NeedsReview** | 4 | Requires manual review | ReadyToBill, OnHold |
      | **Invoicing** | 5 | Being invoiced | Invoiced |
      | **Invoiced** | 6 | Successfully invoiced | (terminal) |
      | **Unbillable** | 7 | Marked non-billable | (terminal) |
      | **ProcessingFailed** | 8 | Failed processing | NotReadyToBill |
      | **OnHold** | 9 | Temporarily paused | NotReadyToBill, ReadyToBill |

      **Status Priority**: OnHold > ProcessingFailed > Processing > NeedsReview >
      Invoiced/Unbillable > ReadyToBill > NotReadyToBill

      ## Related Services

      - [Create BillableCharge](#operation/createBillableCharge)
      - [Update BillableCharge](#operation/updateBillableCharge)
      - [Mark As Ready](#operation/markBillableChargesAsReady)
      - [Mark Unbillable](#operation/markBillableChargesUnbillable)
      - [Update Hold Status](#operation/updateBillableChargeHoldStatus)
      - [Clear Review & Mark Ready](#operation/clearNeedsReviewAndMarkAsReady)

      ## Related Entities

      - [BillableCharge](#tag/BillableCharge-Entities)
      - [BillMaster](#tag/Transaction-Entities)
      - [BillMasterTransaction](#tag/Transaction-Entities)

  - name: Invoicing Workflow
    description: |
      # Invoicing Workflow: Charges to Client Invoice

      This workflow extends the billing process from ready-to-bill charges to delivered client invoices.

      ```
      1. INVOICE GENERATION
         └─> BillableCharges with status=ReadyToBill selected
         └─> InvoiceStatementBatch created
         └─> Charges grouped by client + billing profile + period
         └─> InvoiceStatement created per group

      2. LINE ITEM CREATION
         └─> BillMasterTransactions grouped by earn code/candidate/period
         └─> InvoiceStatementLineItem created for each group
         └─> Discounts, surcharges, taxes applied

      3. INVOICE FINALIZATION
         └─> Invoice reviewed and approved
         └─> isFinalized set to true
         └─> Invoice becomes immutable
         └─> Invoice number generated

      4. DELIVERY TO CLIENT
         └─> Email with PDF attachment
         └─> Related endpoint: POST /services/InvoiceStatement/email
         └─> deliveryStatus updated
         └─> Or: Export to portal/EDI via generateExport

      5. PAYMENT TRACKING
         └─> InvoicePayment records created
         └─> invoiceStatementPaidStatus updated
         └─> outstandingBalance calculated

      6. GL EXPORT
         └─> Invoice data exported to external accounting systems
         └─> Revenue recognized in AccountingPeriod
      ```

      ## Invoice Lifecycle States

      | Field | Values | Description |
      |-------|--------|-------------|
      | **status** | Draft, Finalized, Approved, Rejected, Voided | Overall invoice status |
      | **isFinalized** | true/false | Whether invoice is locked |
      | **deliveryStatus** | Not Delivered, Email Sent, Downloaded, Printed | Delivery tracking |
      | **invoiceStatementPaidStatus** | Unpaid, Partially Paid, Paid, Overpaid | Payment status |

      ## Credit Invoice Process

      When corrections are needed after finalization:

      ```
      1. Original Invoice (isCredited = false)
         └─> POST /services/InvoiceStatement/credit

      2. Credit Invoice Created (negative amounts)
         └─> creditOfInvoiceStatement = Original Invoice ID
         └─> Cancels original invoice

      3. Original Invoice Updated
         └─> isCredited = true
         └─> creditedByInvoiceStatement = Credit Invoice ID

      4. New Corrected Invoice (if needed)
         └─> Created with correct data
      ```

      ## Related Services

      - [Generate Export](#operation/generateInvoiceExport)
      - [Email Invoice](#operation/emailInvoiceStatements)
      - [Credit Invoice](#operation/creditInvoiceStatement)
      - [Repost Request](#operation/repostInvoiceRequest)

      ## Related Entities

      - [InvoiceStatement](#tag/Invoice-Entities)
      - [InvoiceStatementLineItem](#tag/Invoice-Entities)
      - [InvoicePayment](#tag/Invoice-Entities)

  - name: Transaction Adjustments
    description: |
      # Transaction Immutability & Adjustments

      BillMasterTransaction records become immutable once they reach certain lifecycle stages.
      This ensures financial data integrity and proper audit trails.

      ## Immutability Rules

      A **BillMasterTransaction** becomes immutable when:

      - `invoiceStatement != null` (already invoiced)
      - `invoiceStatementBatch != null` (stamped for invoicing)
      - `billMasterTransactionDistributionBatch != null` (in revenue distribution)

      ## Adjustment Pattern

      To modify immutable transactions, create **adjustment pairs**:

      ### 1. Reversal Transaction
      - Negates original quantity and amount
      - Links via `reversalOfTransaction` field
      - Increments `adjustmentSequenceNumber`
      - `transactionType` = "Reversal"

      ### 2. Adjustment Transaction
      - Contains corrected values
      - Further increments `adjustmentSequenceNumber`
      - `transactionType` = "Adjustment"
      - System recalculates `netAmount` and `netQuantity`

      ## Example Adjustment

      ```
      Original Transaction:
      - quantity: 8.0
      - amount: 400.00
      - adjustmentSequenceNumber: 0
      - transactionType: New

      Reversal Transaction (created when correction needed):
      - quantity: -8.0
      - amount: -400.00
      - adjustmentSequenceNumber: 1
      - transactionType: Reversal
      - reversalOfTransaction: {id: <original transaction ID>}

      Adjustment Transaction (corrected values):
      - quantity: 9.0
      - amount: 450.00
      - adjustmentSequenceNumber: 2
      - transactionType: Adjustment

      Net Result:
      - netQuantity: 9.0 (8.0 - 8.0 + 9.0)
      - netAmount: 450.00 (400.00 - 400.00 + 450.00)
      ```

      ## Transaction Types

      | Type | ID | Usage | Can Edit |
      |------|----|----|----------|
      | **New** | 1 | Original from billing sync | Before invoicing |
      | **Adjustment** | 2 | Corrected transaction | Before invoicing |
      | **Reversal** | 3 | Negated transaction | No (auto-created) |
      | **Unbillable** | 6 | Marked non-billable | No |

      ## Transaction Origin

      Controls edit permissions:

      - **Manual** (1): Created by user action
      - **BillingSync** (2): Automated sync from time/expense
      - **System** (3): System-generated

      **Rule**: Transactions can only be updated if origin matches the requesting system.

      ## Related Entities

      - [BillMasterTransaction](#tag/Transaction-Entities)
      - [BillMaster](#tag/Transaction-Entities)

  - name: BillableCharge Services
    description: |
      # BillableCharge Service Endpoints

      Service endpoints for creating, updating, and managing billable charges through their lifecycle.

      ## Overview

      A **BillableCharge** records a chargeable fee, capturing key details like amounts, rates, effective
      dates, and status. It ties charges to BillMasterTransactions and manages them through the billing
      workflow from creation to invoicing.

      ## Available Operations

      - **PUT /services/BillableCharge** - Create new billable charge
      - **POST /services/BillableCharge/{id}** - Update existing charge
      - **POST /services/BillableCharge/markAsReady** - Mark charges ready to bill
      - **POST /services/BillableCharge/markUnbillable** - Mark charges as unbillable
      - **PUT /services/BillableCharge/updateHoldStatus** - Place on hold or release
      - **POST /services/BillableCharge/clearNeedsReviewAndMarkAsReady** - Clear review flags

      ## Workflow Context

      See [Billing Workflow](#tag/Billing-Workflow) for complete lifecycle documentation.

      ## Related Entities

      - [BillableCharge Entity](#tag/BillableCharge-Entities)
      - [BillMaster Entity](#tag/Transaction-Entities)
      - [BillMasterTransaction](#tag/Transaction-Entities)

  - name: Invoice Services
    description: |
      # Invoice Service Endpoints

      Service endpoints for managing invoice generation, delivery, and lifecycle operations.

      ## Overview

      **InvoiceStatements** consolidate BillableCharges into client-facing invoices with line items,
      discounts, surcharges, and taxes. These endpoints handle invoice finalization, email delivery,
      export to various formats, credit invoice creation, and integration with external accounting systems.

      ## Available Operations

      - **POST /services/InvoiceStatement/generateExport** - Export invoices to PDF/CSV/GL
      - **POST /services/InvoiceStatement/email** - Email invoices to clients
      - **POST /services/InvoiceStatement/credit** - Create credit invoice
      - **POST /services/InvoiceStatement/repostRequest** - Repost to accounting systems

      ## Query Operations

      - **GET /entity/InvoiceStatement/{id}** - Retrieve invoice by ID
      - **GET /query/InvoiceStatement** - Search invoices

      ## Workflow Context

      See [Invoicing Workflow](#tag/Invoicing-Workflow) for complete process documentation.

      ## Related Entities

      - [InvoiceStatement Entity](#tag/Invoice-Entities)
      - [InvoicePayment Entity](#tag/Invoice-Entities)
      - [InvoiceStatementLineItem](#tag/Invoice-Entities)

  - name: BillableCharge Entities
    description: |
      # BillableCharge Entity Documentation

      The BillableCharge entity records a chargeable fee, capturing key details like the fee amount, rate type, and effective dates, and ties these charges to specific BillMasterTransactions.

      **CRUD Access**: READ (via REST API). CREATE and UPDATE operations available via dedicated service endpoints for workflow operations.

      **Entitlements**: View Billable Charge, Add Billable Charge, Edit Billable Charge, Mark Billable Charge Unbillable, Mark Billable Charge Ready

      **Related Services**: [Create BillableCharge](#operation/createBillableCharge), [Update BillableCharge](#operation/updateBillableCharge), [Mark As Ready](#operation/markBillableChargesAsReady)

      **Workflow**: See [Billing Workflow](#tag/Billing-Workflow)

      ---

      ## BillableCharge Fields

      ### Core Identification
      - **id** (Integer, Required, Read-only): Unique identifier for this entity
      - **description** (String, Required): Required description of the charge. Auto-generated descriptions include candidate name, job title, and period end date. Used for display in invoices, reports, and UI lists. Can be manually specified when creating charges via API.
      - **periodEndDate** (Date, Required): End date of billing period. Required field used for effective-dated version selection of BillingProfile and InvoiceTerm. Typically represents end of pay period from timesheet approval. Cannot be changed once charge is invoiced. Used for grouping charges by billing period and determining which rate versions apply.
      - **externalID** (String): External system identifier for integration with third-party billing/accounting systems. Useful for correlating charges across systems.

      ### Workflow & Status
      - **status** (To-one association, Read-only): Calculated field representing current charge state in billing workflow. Cannot be directly updated - changes based on transaction states, sync status, hold status, invoice associations, and needsReview flags. Priority order (highest to lowest): OnHold > ProcessingFailed > Processing > NeedsReview > Invoiced/Unbillable > ReadyToBill > NotReadyToBill. Automatically recalculated when child transactions or BillMasters change. Used extensively for filtering in queries, determining workflow actions, and controlling invoicing eligibility.
      - **isInvoiced** (Boolean, Read-only): Calculated field indicating if any transaction has been included in an invoice (true if any BillMasterTransaction.invoiceStatementID is not null). Automatically updated when transactions are invoiced. Once true, charge becomes immutable and cannot be modified. Used to filter charges in invoicing workflows and UI lists. Special ACL protection prevents updates when invoiced.
      - **readyToBillOverride** (Boolean, Read-only): Manual override flag that forces charge to ReadyToBill status even when transactions aren't fully approved. Set to true by markAsReady service operation. Automatically reset to false when new BillMasterTransactions are added or new timecard data is imported, requiring re-approval. Used for special billing situations requiring early invoicing before full approval workflow completes.
      - **markAsReadyEligible** (Boolean, Read-only): Calculated field indicating if charge can be marked ready via markAsReady operation. True when charge has at least one eligible transaction (isEligible=1, canInvoice=1) AND either: (1) transactions have needsReview=1 flag set, OR (2) transactions are not approved (transactionStatusID≠4) without readyToBillOverride. Used by UI to enable/disable "Mark As Ready" button.

      ### Financial
      - **subtotal** (Decimal, Read-only): Sum of all BillMasterTransaction amounts for this charge. Only calculated if all transactions use same currency - set to NULL if mixed currencies exist, preventing invalid total display. Automatically recalculated when transactions are added, updated, or deleted. Used in reports, list views, and invoice validation.
      - **hasAdjustment** (Boolean): Indicates whether billable charge has an adjustment. This field is set automatically when an adjustment has occurred in the system, and it can also be manually overridden later if the charge needs to be manually adjusted.
      - **hasRebill** (Boolean): Indicates whether billable charge has been rebilled.

      ### Associations - Primary
      - **placement** (To-one association): Links charge to worker's job assignment. Either placement or billingProfile must be provided on creation. If provided, charge inherits billingProfile, location, GL segments, and branch information from placement. Immutable after creation - cannot be updated once set. Used for authorization checks and configuration inheritance.
      - **billingProfile** (To-one association): Defines billing configuration including rates, schedules, and terms. Required for invoicing - either set directly or inherited from placement. System selects effective-dated version based on periodEndDate. Cannot be updated once charge is invoiced. Used to determine discount rates, surcharge rates, billing calendar, and invoice terms.
      - **invoiceTerm** (To-one association, Read-only): Defines payment terms, billing frequency, approval requirements, and billing calendar. Automatically derived from billingProfile. Required for invoicing - charges without invoiceTerm are excluded from invoice processing. System selects effective-dated version based on periodEndDate.

      ### Associations - Context
      - **candidate** (To-one association, Read-only): Associated Candidate (worker)
      - **jobOrder** (To-one association, Read-only): Associated JobOrder
      - **clientCorporation** (To-one association, Read-only): Associated ClientCorporation (end client)
      - **billingClientCorporation** (To-one association, Read-only): Bill-to company (may differ from end client)
      - **billingClientContact** (To-one association, Read-only): Billing contact person
      - **billingCorporateUser** (To-one association, Read-only): Associated CorporateUser for billing
      - **currencyUnit** (To-one association, Read-only): Currency unit for this charge

      ### Entry Type & Time Tracking
      - **entryTypeLookup** (To-one association, Required): Entry type - Timesheet (1) or Expense (2)
      - **timesheet** (To-one association, Read-only): Associated Timesheet (if entry type is Timesheet)
      - **expenseSheet** (To-one association, Read-only): Associated ExpenseSheet (if entry type is Expense)
      - **timeAndExpenseBranch** (String, Read-only): Time and expense branch identifier from the placement, used for organizational tracking and reporting in multi-branch/division environments.

      ### Billing Configuration
      - **billingFrequency** (String, Read-only): Billing frequency derived from the associated InvoiceTerm (e.g., "Weekly", "Bi-Weekly", "Monthly"). Used for display and reporting purposes.
      - **billingSchedule** (Integer, Read-only): Billing schedule identifier

      ### Transaction Status
      - **transactionStatus** (To-one association, Read-only): Transaction status (Pending, Submitted, Payment Approved, Approved)
      - **transactionType** (To-one association, Read-only): Transaction type (New, Adjustment, Reversal, Unbillable)

      ### General Ledger Integration
      - **generalLedgerStatus** (To-one association, Read-only): Tracks unbilled revenue GL export status with special handling for distribution failures. Calculated as minimum status across all child transactions, with distribution failures (status 9) prioritized via internal value 0. Updated by revenue distribution batch processes and pay-export-services during GL export. Used for GL integration reconciliation and identifying charges with failed exports requiring attention. **Status Values**: 1=Export Failed, 2=Ready for Distribution, 3=Stamped for Distribution, 4=Creating Distribution, 5=Ready for Export, 6=Export Queued, 7=Export in progress, 8=Export Successful, 9=Distribution Creation Failed
      - **generalLedgerSegment1** (To-one association): Chart of Accounts categorization for GL export. By default configured as Class. Automatically inherited from placement during charge creation. Can be manually updated with "View General Ledger" permission. Critical for proper revenue recognition and financial reporting. Typically represents department/division level.
      - **generalLedgerSegment2** (To-one association): Chart of Accounts categorization for GL export. By default configured as Division. Automatically inherited from placement during charge creation. Can be manually updated with "View General Ledger" permission. Typically represents cost center level.
      - **generalLedgerSegment3** (To-one association): Chart of Accounts categorization for GL export. By default configured as Department. Automatically inherited from placement during charge creation. Can be manually updated with "View General Ledger" permission. Typically represents product/service line level.
      - **generalLedgerSegment4** (To-one association): Chart of Accounts categorization for GL export. By default configured as Country. Automatically inherited from placement during charge creation. Can be manually updated with "View General Ledger" permission. Typically represents location/region level.
      - **generalLedgerSegment5** (To-one association): Chart of Accounts categorization for GL export. By default configured as Location. Automatically inherited from placement during charge creation. Can be manually updated with "View General Ledger" permission. Typically represents project/campaign level.
      - **generalLedgerServiceCode** (To-one association): General Ledger Service Code for product/service categorization

      ### Accounting Periods
      - **minAccountingPeriod** (To-one association, Read-only): Minimum accounting period of all transactions on this charge
      - **maxAccountingPeriod** (To-one association, Read-only): Maximum accounting period of all transactions on this charge
      - **transactionAccountingPeriods** (To-many association, Read-only): Collection of all distinct AccountingPeriod records referenced by transactions on this charge. Provides quick access to all accounting periods spanned by the charge's transactions without needing to query individual transactions. Used for accounting period close validation, ensuring charges don't span closed periods, and financial reporting period reconciliation. Critical for month-end/quarter-end close processes. **Usage**: GET /entity/BillableCharge/{id}/transactionAccountingPeriods

      ### Transaction Collections
      - **billableTransactions** (To-many association, Read-only): Collection of BillableChargeBillableTransaction records linking this charge to individual BillMasterTransactions. Each entry represents a single billable transaction (time or expense entry) that contributes to this charge's total. This is the primary relationship connecting BillableCharge to the detailed transaction data. Used for drilling down from charge-level view to individual time/expense entries. **Usage**: GET /entity/BillableCharge/{id}/billableTransactions
      - **billMasters** (To-many association, Read-only): Collection of BillMaster records associated with this charge. BillMasters are intermediate grouping entities that organize transactions by placement, period, and earn code before they are invoiced. Multiple BillMasters can exist for a single BillableCharge when transactions span different earn codes or have different billing attributes. Used in the billing sync process to group transactions for rate calculation and invoice line item generation. **Usage**: GET /entity/BillableCharge/{id}/billMasters
      - **summaryTransactions** (To-many association, Read-only): Collection of BillableChargeSummaryTransaction records providing pre-aggregated views of transaction data grouped by key dimensions (earn code, bill rate, date, etc.). Used for performance optimization in reports and UI displays, avoiding need to aggregate individual transactions on every query. Summary records are maintained automatically as transactions are added, updated, or deleted. **Usage**: GET /entity/BillableCharge/{id}/summaryTransactions
      - **invoicedTransactions** (To-many association, Read-only): Collection of transactions that have been included in an invoice. Subset of billableTransactions where invoiceStatementID is not null. Used to differentiate between invoiced and pending transactions on partially invoiced charges. When a charge is fully invoiced, this collection will match billableTransactions. **Usage**: GET /entity/BillableCharge/{id}/invoicedTransactions
      - **unbillableTransactions** (To-many association, Read-only): Collection of BillableChargeUnbillableTransaction records representing transactions marked as unbillable (transactionStatusID = 6). These transactions are excluded from invoicing but retained for audit trail and reporting. Transactions can be marked unbillable due to rate issues, client disputes, approval rejections, or manual override. Used for tracking non-billable work and understanding revenue leakage. **Usage**: GET /entity/BillableCharge/{id}/unbillableTransactions

      ### Invoice & Distribution
      - **invoiceStatements** (To-many association, Read-only): Collection of InvoiceStatements that include this billable charge. A charge can appear on multiple invoices (e.g., original invoice and credit invoice). When a charge is invoiced: BillMasterTransactions are linked to InvoiceStatementLineItems, charge status progresses to Invoicing (5) or Invoiced (6), isInvoiced flag is set to true, and charge becomes immutable. **Usage**: GET /entity/BillableCharge/{id}/invoiceStatements
      - **billMasterTransactionDistributionBatches** (To-many association, Read-only): Collection of BillMasterTransactionDistributionBatch records tracking unbilled revenue GL distribution processing for this charge's transactions. Each batch represents an automated GL export run that created accounting entries for revenue recognition. Used for GL reconciliation, tracking distribution failures, and understanding when revenue was recognized in the general ledger. Critical for financial close processes and revenue recognition compliance. **Usage**: GET /entity/BillableCharge/{id}/billMasterTransactionDistributionBatches

      ### Calendar & Cycles
      - **billingCalendarInstances** (To-many association, Read-only): Collection of CalendarInstance records representing billing periods associated with this charge. Calendar instances define the specific date ranges for billing cycles (e.g., weekly periods ending every Friday). Used to associate charges with billing schedules, determine invoice generation timing, and group charges by billing period. Multiple instances can exist when charges span billing period boundaries. **Usage**: GET /entity/BillableCharge/{id}/billingCalendarInstances
      - **payBillCycles** (To-many association, Read-only): Collection of PayBillCycle records displaying the associated billing cycle(s) for this charge. Pay Bill Cycles coordinate payroll and billing periods, ensuring consistent timing between paying contractors and billing clients. Typically one cycle per charge, but can be multiple if charge configuration changes during the period or if charge spans multiple pay/bill cycle boundaries. Used for cycle-based reporting and processing coordination. **Usage**: GET /entity/BillableCharge/{id}/payBillCycles

      ### Integration & Sync
      - **billingSyncBatchFileAttachments** (To-many association, Read-only): Collection of BillingSyncBatchFileAttachment records linking this charge to billing sync import files. When charges are created via automated billing sync (importing timecard data from external systems), this tracks which import files contained the source data. Used for data lineage tracking, troubleshooting sync issues, and audit trails showing original source of billing data. Essential for reconciling with external time tracking systems. **Usage**: GET /entity/BillableCharge/{id}/billingSyncBatchFileAttachments

      ### Audit
      - **dateAdded** (Timestamp, Required, Read-only): Unix timestamp (milliseconds) when entity was added
      - **dateLastModified** (Timestamp, Required, Read-only): Unix timestamp (milliseconds) when entity was last modified
      - **addedByUser** (To-one association, Read-only): CorporateUser who added this record

  - name: Invoice Entities
    description: |
      # Invoice Entity Documentation

      Core entities involved in invoice generation and delivery.

      ## InvoiceStatement

      **Primary invoice document** consolidating billing charges for a client.

      **Key Fields:**
      - `invoiceStatementID`: Unique identifier
      - `invoiceStatementNumber`: Client-facing invoice number
      - `isFinalized`: Whether invoice is locked and deliverable
      - `subtotal`, `discountAmount`, `surchargeAmount`, `taxAmount`, `total`: Financial amounts
      - `amountPaid`, `outstandingBalance`: Payment tracking
      - `deliveryStatus`: Delivery state (Email Sent, Downloaded, etc.)
      - `invoiceStatementPaidStatus`: Payment state (Unpaid, Paid, etc.)

      **Related Services:**
      - [Query Invoice](#operation/getInvoiceStatement)
      - [Email Invoice](#operation/emailInvoiceStatements)
      - [Generate Export](#operation/generateInvoiceExport)
      - [Credit Invoice](#operation/creditInvoiceStatement)

      **Workflow:** See [Invoicing Workflow](#tag/Invoicing-Workflow)

      ---

      ## InvoiceStatementLineItem

      Individual line items on an invoice, grouping related transactions.

      **Key Fields:**
      - `description`: Line item description
      - `quantity`, `rate`, `amount`: Financial details
      - `earnCode`: Type of work/expense

      ---

      ## InvoicePayment

      Payment records applied to invoices.

      **Key Fields:**
      - `invoicePaymentID`: Unique identifier
      - `paymentAmount`: Amount paid
      - `paymentDate`: When payment received
      - `paymentMethod`: How payment was made
      - `isReversed`: Whether payment was reversed

      ---

      ## InvoiceStatementDiscount / Surcharge / Tax

      Financial adjustments applied to invoices:
      - **Discounts**: Reduce invoice total (volume discounts, early payment discounts)
      - **Surcharges**: Increase invoice total (rush fees, admin fees)
      - **Taxes**: Sales tax calculations

      ---

      ## Lookup Entities

      - **InvoiceStatementStatusLookup**: Invoice lifecycle statuses
      - **InvoiceStatementDeliveryStatusLookup**: Delivery tracking
      - **InvoiceStatementPaidStatusLookup**: Payment status

      ---

      ## Batch Entities

      - **InvoiceStatementBatch**: Bulk invoice generation tracking
      - **InvoiceStatementExportBatch**: Export operation tracking
      - **InvoiceStatementEmailBatch**: Email delivery batch tracking

  - name: Transaction Entities
    description: |
      # Transaction Entity Documentation

      Core entities for transaction management and grouping.

      ## BillMaster

      **Transaction grouping entity** that aggregates transactions by earn code and date.

      **CRUD Access**: READ, UPDATE

      **Entitlements**: View Bill Master, Edit Billable Charge

      **Purpose**: BillMaster records group transactions by earn code, transaction date, and external ID. This grouping enables detailed rate tracking by earn code, easy identification of overtime vs. regular hours, and integration with external time & expense systems.

      **Related Services**: Created automatically via BillableCharge operations

      **Workflow**: See [Billing Workflow](#tag/Billing-Workflow)

      ---

      ### BillMaster Fields

      #### Core Identification
      - **id** (Integer, Required, Read-only): Unique identifier for this entity.

      - **externalID** (String, Read-only): External system identifier for integration with third-party time/expense systems. Auto-generated as `BH_INJECTED_ID_{billMasterID}` if duplicate detected. Used with unique constraint on `earnCodeID + transactionDate + externalID + workedShiftID` to prevent duplicate imports. Essential for correlating BillMasters with external timecard records.

      #### Associations - Parent
      - **billableCharge** (To-one association, Read-only): Parent BillableCharge container that groups all BillMasters for a billing period. The charge manages workflow status (NotReadyToBill, ReadyToBill, Invoiced) and approval requirements. Multiple BillMasters can belong to a single BillableCharge when transactions span different earn codes or dates. *Default fields: id*

      #### Associations - Configuration
      - **earnCode** (To-one association, Read-only): Defines type of work performed (regular hours, overtime, double-time, PTO, holiday, sick, etc.). Primary grouping dimension for BillMaster records. **Key Behaviors**: Controls discount eligibility via `isDiscountable` flag - discounts can only be applied if earnCode.isDiscountable=true. Determines chargeTypeLookup via EarnCodeGroup. Links to rate cards for billing calculations. Immutable after creation. Required field used in unique constraint. *Default fields: id, externalID, title*

      - **chargeTypeLookup** (To-one association, Required, Read-only): Categorizes as Time (1), Expense (2), or Time and Expense (3). Automatically derived from EarnCode's EarnCodeGroup during creation. Immutable after creation. Used for: (1) Grouping transactions on invoices, (2) Separating time from expense reporting, (3) Validating customer required fields, (4) Determining applicable workflows. **Options**: Timesheet or Expense Report

      - **location** (To-one association, Updatable): Work location critical for sales tax calculations. Copied from Placement during BillMaster creation. Updatable via BillMasterSyncBatch when placement location changes (syncLocation=true). **Sales Tax Determination**: System matches location effective-dated version based on transactionDate. Used to determine applicable tax rates via LocationVersionTaxGroups. Invoice creation queries sales tax rates based on location and transactionDate falling between location's effectiveDate and effectiveEndDate. Location changes can result in different tax rates for transactions on different dates. *Default fields: id, clientCorporation, candidate, title, effectiveDate, effectiveEndDate, versionID, externalID*

      - **payBillCycle** (To-one association, Read-only): Links to billing cycle defining billing frequency and calendar. Contains billingCalendarID used to determine billingCalendarInstance. Sourced from InvoiceTerm effective for transactionDate. **Update Behavior**: Updatable via BillMasterSyncBatch when invoice terms change. Used for billing period determination, calendar synchronization, coordinating payroll and billing cycles, and grouping transactions by pay/bill period. Requires "viewPayBillCycle" entitlement to read. *Default fields: id*

      #### Billing Calendar
      - **billingCalendarInstance** (To-one association, Read-only): Determines billing period and invoicing eligibility. Automatically matched based on transactionDate falling within calendar instance date range. **Eligibility Rule**: `isEligible = (billingCalendarInstance.endDate < current date)`. Updatable via BillMasterSyncBatch when billing calendar changes on placement. Derived from InvoiceTerm's payBillCycle. Used extensively for period-based invoicing and eligibility calculations. Requires "viewCalendar" entitlement to read. *Default fields: id, label*

      #### Sync & Import
      - **billingSyncBatch** (To-one association, Read-only): Links to originating time & expense import batch. All BillMasters from same external batch share same billingSyncBatch for traceability. Enables tracking which external events created which BillMasters. Used to process corrections and updates to existing batches. Provides audit trail for external system integration. Immutable after creation. *Default fields: id*

      - **billingSyncBatchFileAttachments** (To-many association, Read-only): BillingSyncBatchFileAttachment - Collection of import files associated with this record. When BillMasters are created via automated billing sync (importing timecard data from external systems), this tracks which import files contained the source data. Used for data lineage tracking, troubleshooting sync issues, and audit trails showing original source of billing data. *Default fields: id* **Usage**: GET /entity/BillMaster/{id}/billingSyncBatchFileAttachments

      #### Transaction Collections
      - **billMasterTransactions** (To-many association, Read-only): Associated BillMasterTransactions containing the audit trail and rate information. Each transaction represents a single time/expense entry with its full lifecycle tracking including rates, amounts, adjustments, and invoice links. This is the primary relationship for accessing detailed transaction data. *Default fields: id* **Usage**: GET /entity/BillMaster/{id}/billMasterTransactions

      #### Customer Required Fields
      - **customerRequiredFields** (To-many association, Read-only): BillMasterCustomerRequiredField - Custom fields required by specific clients (e.g., project codes, cost centers, department codes, PO numbers). These fields are defined in the client's InvoiceTerm and automatically associated when BillMaster is created. Each field can be: (1) **Text**: Free-text input (e.g., project description), (2) **Custom Picker**: Dropdown selection from predefined options, (3) **Purchase Order**: PO number entry with validation. Used for client-specific reporting, invoice line item details, and GL export segmentation. **Usage**: GET /entity/BillMaster/{id}/customerRequiredFields

      #### Financial Adjustments
      - **discountRates** (To-many association, Updatable): Percentage or fixed-amount reductions applied to billing (volume discounts, early payment discounts, client-specific rate reductions). Copied from InvoiceTermVersion during BillMaster creation. **Eligibility**: Only applicable if earnCode.isDiscountable=true - system filters discounts for non-discountable earn codes. **Update Behavior**: Updatable via BillMasterSyncBatch (syncDiscount=true) when invoice terms change. System selects rate versions where transactionDate falls between effectiveDate and effectiveEndDate. **Calculation**: Applied in calculatePriority order during invoice calculation - each discount calculated on amount after previous discounts (compounding). Can affect tax base unless ignoreForSalesTaxCalculations=true. *Default fields: id, title, effectiveDate, effectiveEndDate, versionID, rate, amount, discountTypeLookup* **Usage**: GET /entity/BillMaster/{id}/discountRates

      - **surchargeRates** (To-many association, Updatable): Additional charges applied to billing (shift differentials, weekend rates, hazard pay, rush fees, administrative fees). Copied from InvoiceTermVersion during BillMaster creation. **Eligibility**: No earn code restrictions - can be applied to any earn code type, unlike discounts. **Update Behavior**: Updatable via BillMasterSyncBatch (syncSurcharge=true) when invoice terms change. System selects rate versions where transactionDate falls between effectiveDate and effectiveEndDate. **Types**: Type 1 = Fixed amount per unit (e.g., $5 per hour shift differential), Type 2+ = Percentage of base amount (e.g., 10% weekend surcharge). Applied during invoice creation after base amount calculation and before tax calculations. *Default fields: id, title, effectiveDate, effectiveEndDate, versionID, rate, amount, type* **Usage**: GET /entity/BillMaster/{id}/surchargeRates

      #### Flags
      - **canInvoice** (Boolean, Updatable): Controls invoicing eligibility. Set to false by invoice creation process after successful invoicing to prevent double-invoicing. Can be manually set to false to temporarily exclude specific earn codes or transaction dates from invoicing without marking as unbillable. One of the few updatable fields on BillMaster. Checked before including transactions in invoices. *Default: true*

      #### Status
      - **transactionStatus** (To-one association, Updatable): Current approval status of the transaction. Controls workflow progression and invoicing eligibility. **Status Values**: 1=Pending (Initial state, awaiting submission), 2=Submitted (Submitted for approval, not yet reviewed), 3=Payment Approved (Approved for payroll but not yet billing), 4=Approved (Fully approved, eligible for invoicing). BillableCharge status calculations prioritize transactions by approval state. Only Approved (4) transactions are invoiced by default unless readyToBillOverride is used.

      - **transactionDate** (Date, Read-only): Business date when work was performed or expense incurred. Critical for effective-dated version matching - determines which versions apply: BillingProfile version, InvoiceTerm version, DiscountRate versions, SurchargeRate versions, PlacementRateCard version, Location version (for sales tax). **Important**: Different from dateAdded (system timestamp). Part of grouping key for BillMaster records. Required field, immutable after creation. System selects configuration versions where transactionDate falls between effectiveDate and effectiveEndDate.

      #### Audit
      - **dateAdded** (Timestamp, Required, Read-only): Date and time when this entity was created in the Bullhorn system. System timestamp that differs from transactionDate (business date of work). Used for audit trails and tracking when billing data was received.

      - **dateLastModified** (Timestamp, Required, Read-only): Date and time when this entity was last modified. Updated automatically whenever the record changes. Used for synchronization, caching, and audit trails.

      - **addedByUser** (To-one association, Required, Read-only): CorporateUser who added the record. Tracks which internal user created this BillMaster, typically the user who initiated the billing sync or manual charge creation. *Default fields: id, firstName, lastName*

      - **owner** (To-one association, Read-only): CorporateUser owner of the record. Typically the user who created the BillableCharge parent, or assigned via ownership rules. Used for authorization checks and record access control. *Default fields: id, firstName, lastName*

      ---

      ## BillMasterTransaction

      **Individual transaction audit trail** recording rates, amounts, and lifecycle.

      **Key Fields:**
      - `billMasterTransactionID`: Unique identifier
      - `quantity`, `rate`, `amount`: Financial details
      - `adjustmentSequenceNumber`: Tracks adjustment history (0 = original)
      - `transactionType`: New, Adjustment, Reversal, Unbillable
      - `transactionOrigin`: Manual, BillingSync, System
      - `invoiceStatement`: Invoice link (when invoiced)
      - `invoiceStatementBatch`: Batch stamping (immutability trigger)
      - `reversalOfTransaction`: Link to reversed transaction
      - `netAmount`, `netQuantity`: Calculated net values after adjustments
      - `isDeleted`, `isUnbillable`, `needsReview`: Workflow flags

      **Immutability:** Once invoiced or distributed, transactions become immutable.
      See [Transaction Adjustments](#tag/Transaction-Adjustments) for modification pattern.

      **Related Services:**
      - Queried via BillableCharge or Invoice relationships

      ---

      ## Transaction Detail Entities

      - **BillMasterTransactionDiscountDetail**: Applied discounts
      - **BillMasterTransactionSurchargeDetail**: Applied surcharges
      - **BillMasterTransactionSalesTaxDetail**: Applied taxes

